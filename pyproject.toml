[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyLibmpsse"
version = "1.0.0"
description = "Python wrapper for libmpsse — FTDI MPSSE (SPI/I2C) operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Nikolas.Young", email = "nikolas_young@foxmail.com"},
]
keywords = ["ftdi", "mpsse", "spi", "i2c"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/liutao12632/pyLibmpsse"
Issues   = "https://github.com/liutao12632/pyLibmpsse/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require external DLLs or hardware integration",
]

[tool.setuptools.packages.find]
where = ["src"]